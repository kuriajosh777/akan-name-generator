<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan name generator</title>
</head>
<body>
    
 <div class="kente-strip" aria-hidden="true"></div>

  <main class="page">
    <header class="intro">
      <p class="eyebrow">Akan Day-Name Finder</p>
      <h1>Every day carries a name.</h1>
      <p class="lede">
        Among the Akan people of Ghana, a child's first name is not chosen —
        it is given by the day they were born. Enter a birthdate below to
        find the name the week itself would have given you.
      </p>
    </header>

    <section class="panel">
      <form id="akan-form" class="form" novalidate>
        <div class="field-row">
          <div class="field">
            <label for="day">Day</label>
            <input type="number" id="day" name="day" min="1" max="31" placeholder="DD" inputmode="numeric" required />
          </div>
          <div class="field">
            <label for="month">Month</label>
            <input type="number" id="month" name="month" min="1" max="12" placeholder="MM" inputmode="numeric" required />
          </div>
          <div class="field">
            <label for="year">Year</label>
            <input type="number" id="year" name="year" min="1" max="9999" placeholder="YYYY" inputmode="numeric" required />
          </div>
        </div>

        <fieldset class="field gender-field">
          <legend>Gender</legend>
          <div class="gender-options">
            <label class="radio-pill">
              <input type="radio" name="gender" value="male" required />
              <span>Male</span>
            </label>
            <label class="radio-pill">
              <input type="radio" name="gender" value="female" />
              <span>Female</span>
            </label>
          </div>
        </fieldset>

        <button type="submit" class="submit-btn">Find my name</button>
      </form>

</body>
</html>
